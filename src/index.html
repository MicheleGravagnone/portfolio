<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>Michele Gravagnone — Backend & DevOps</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Michele Gravagnone, backend developer and MSc student in CSIT at Lodz University of Technology, focused on distributed systems and DevOps. Explore APIs, infrastructure and developer tools."
    />
    <meta name="theme-color" content="#fffefc" />
    <style>
      @font-face {
        font-family: "JetBrains Mono Nerd Font Mono";
        src: url("fonts/jetbrains-mono-nerd-welcome.woff2") format("woff2");
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        unicode-range: U+002E, U+0067, U+006D;
      }
    </style>
    <link rel="icon" href="favicon.ico" />
    <link
      rel="preload"
      href="fonts/jetbrains-mono-nerd-welcome.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      try {
        const saved = localStorage.getItem("portfolio-theme");
        document.documentElement.dataset.theme =
          saved === "light" || saved === "dark" ? saved : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
